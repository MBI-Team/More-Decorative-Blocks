# Network and SSL Configuration for More Decorative Blocks Project
# This file contains settings to help resolve SSL certificate validation issues
# and improve network connectivity during builds
# SSL/TLS Protocol Settings
# Enable modern TLS protocols
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3
# Trust Store Settings (using default JVM trust store)
# Leave these commented to use the system default trust store
# systemProp.javax.net.ssl.trustStore=
# systemProp.javax.net.ssl.trustStorePassword=
# Key Store Settings
# systemProp.javax.net.ssl.keyStore=
# systemProp.javax.net.ssl.keyStorePassword=
# Connection timeout settings (in milliseconds)
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.connectionTimeout=60000
systemProp.https.socketTimeout=60000
# Additional JVM network settings
systemProp.http.keepAlive=true
systemProp.http.maxConnections=5
systemProp.com.sun.net.useExclusiveBind=false
# Additional SSL settings to help with certificate validation
# These are conservative settings that maintain security while fixing common issues
# Enable Certificate Revocation List checking
systemProp.com.sun.security.enableCRLDP=true
# Enable Authority Information Access certificate validation
systemProp.com.sun.security.enableAIAcaIssuers=true
# Debug settings (uncomment only for troubleshooting)
# systemProp.javax.net.debug=ssl:handshake
# systemProp.javax.net.debug=all