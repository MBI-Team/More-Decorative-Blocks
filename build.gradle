import java.text.SimpleDateFormat

plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
}

// Disable neoFormPatchUserDev task if it exists
tasks.configureEach {
    if (name == "neoFormPatchUserDev") {
        enabled = false
        println "neoFormPatchUserDev task has been disabled"
    }
}

// 解决 ASM 版本冲突问题 - 强制所有 ASM 库使用相同版本
configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.ow2.asm' && details.requested.name.startsWith('asm-')) {
            details.useVersion '9.7'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)  // 使用Java 正确以获得更好的NG兼容性
    }
}

// Note: SSL settings are now configured in gradle.properties to avoid hardcoding system properties
// This allows for more flexible configuration depending on the network environment

def getGitCommitHash() {
    try {
        def stdout = new ByteArrayOutputStream()
        providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        println("Git Failed,please check git" + e)
        // 如果 Git 不可用或者发生错误，返回随机哈希作为备选方案
        return generateRandomHash()
    }
}

/**
 * 生成一个8位随机哈希字符串
 * 格式为：字母-数字-字母-数字-字母-数字-字母-数字
 *
 * @return 8位随机哈希字符串
 */
def static generateRandomHash() {
    def letters = "abcdefghijklmnopqrstuvwxyz"
    def digits = "0123456789"
    def hash = ""

    // 第一位：字母
    hash += letters.charAt((int) (Math.random() * letters.length()))
    // 第二位：数字
    hash += digits.charAt((int) (Math.random() * digits.length()))
    // 第三位：字母
    hash += letters.charAt((int) (Math.random() * letters.length()))
    // 第四位：数字
    hash += digits.charAt((int) (Math.random() * digits.length()))
    // 第五位：字母
    hash += letters.charAt((int) (Math.random() * letters.length()))
    // 第六位：数字
    hash += digits.charAt((int) (Math.random() * digits.length()))
    // 第七位：字母
    hash += letters.charAt((int) (Math.random() * letters.length()))
    // 第八位：数字
    hash += digits.charAt((int) (Math.random() * digits.length()))

    return hash
}

/**
 * 生成一个4位随机数字字符串
 *
 * @return 4位随机数字字符串
 */
def static generateRandomHash2() {
    def digits = "0123456789"
    def hash = ""

    hash += digits.charAt((int) (Math.random() * digits.length()))
    hash += digits.charAt((int) (Math.random() * digits.length()))
    hash += digits.charAt((int) (Math.random() * digits.length()))
    hash += digits.charAt((int) (Math.random() * digits.length()))

    return hash
}

/**
 * 检测当前年月日的方法
 *
 * @return 当前日期字符串，格式为 yyyyMMdd
 */
def static getCurrentDate() {
    def date = new Date()
    def dateFormat = new SimpleDateFormat("yyyyMMdd")
    return dateFormat.format(date)
}

// 从 gradle.properties 加载属性
def mod_id = project.mod_id
def mod_name = project.mod_name
def mod_version = project.mod_version + "-" + getGitCommitHash() + "+" + getCurrentDate() + generateRandomHash2()
def minecraft_version = project.minecraft_version
def neo_version = project.neo_version

// Parchment 映射配置（通过 gradle.properties 自动应用）
// 无需在此处显式配置，neoforged 插件会自动读取 neogradle.subsystems.parchment.* 属性

// 添加仓库配置以解决依赖下载问题
repositories {
    // 添加更多镜像源以增加成功率
    maven { 
        url = 'https://maven.minecraftforge.net/'
    }
    maven { 
        url = 'https://maven.neoforged.net/releases' 
    }
    // 使用阿里云镜像源以提高在中国大陆的下载速度
    maven { 
        url = 'https://maven.aliyun.com/repository/public' 
    }
    maven { 
        url = 'https://maven.aliyun.com/repository/google' 
    }
    maven { 
        url = 'https://maven.aliyun.com/repository/gradle-plugin' 
    }
    // 使用华为云镜像作为 NeoForge 的备用镜像源
    maven { 
        url = 'https://repo.huaweicloud.com/repository/maven/' 
    }
    mavenCentral()
    mavenLocal()
}

// 配置 Minecraft 和 NeoForge
minecraft {
    version = minecraft_version
}

// 依赖配置
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // 测试依赖
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testImplementation 'org.mockito:mockito-core:4.6.1'
    testImplementation 'org.mockito:mockito-inline:4.6.1'
}

// 测试配置
test {
    useJUnitPlatform()
}

// 处理资源文件
processResources {
    duplicatesStrategy = DuplicatesStrategy.WARN

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description: mod_description,
            github_api_url : github_api_url,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'GradleInit.properties']) {
        expand replaceProperties
    }

    // 复制其他资源文件
    from('src/generated/resources') {
        include 'assets/**'
        include 'data/**'
    }
}

// 为 IntelliJ IDEA 提供额外的资源配置
idea {
    module {
        // 确保资源目录被正确识别
        inheritOutputDirs = true
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.WARN

    // 包含处理后的资源文件
    from(processResources) {
        include '**/*'
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }

    archiveBaseName = mod_id
    archiveVersion = mod_version
}

// 确保测试可以访问主类路径
sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources', 'src/main/templates']
        }
    }
    test {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Apply network configuration initialization script
apply from: 'init-network.gradle'

// Apply SSL connection test script
apply from: 'ssl-test.gradle'

// Configure JVM system properties for network connections if they're not already set
if (!project.hasProperty('disableNetworkConfig')) {
    // These properties are now configured in gradle.properties but we ensure they're available
    ext.set("networkConfigApplied", true)
}