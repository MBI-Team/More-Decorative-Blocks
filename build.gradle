plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.142'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 从 gradle.properties 加载属性
def mod_id = project.mod_id
def mod_name = project.mod_name
def mod_version = project.mod_version
def minecraft_version = project.minecraft_version
def neo_version = project.neo_version

// 配置 Minecraft 和 NeoForge
minecraft {

}

// 依赖配置
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // 测试依赖
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testImplementation 'org.mockito:mockito-core:4.6.1'
    testImplementation 'org.mockito:mockito-inline:4.6.1'
}

// 测试配置
test {
    useJUnitPlatform()
}

// 处理资源文件
processResources {
    duplicatesStrategy = DuplicatesStrategy.WARN

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'system.properties']) {
        expand replaceProperties
    }

    // 复制其他资源文件
    from('src/generated/resources') {
        include 'assets/**'
        include 'data/**'
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.WARN

    // 包含处理后的资源文件
    from(processResources) {
        include '**/*'
    }

    manifest {
        attributes([
                'Specification-Title'   : project.mod_name,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : project.mod_version,
                'Implementation-Title'  : project.mod_name,
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor' : project.mod_authors,
        ])
    }

    archiveBaseName = project.mod_id
    archiveVersion = project.mod_version
}

// 确保测试可以访问主类路径
sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources', 'src/main/templates']
        }
    }
    test {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}