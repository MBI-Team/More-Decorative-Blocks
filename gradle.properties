# Main mod info
mod_id=more_decorative_blocks
mod_name=More Decorative Blocks
mod_license=MIT
# version named rules:
# <major>.<minor>.<patch>-<pre-release>-<gitnumber>+<build>
# major:main version number,big update.
# minor:second version number,add new function but not change the game.
# patch:third version number,fix bugs.
# pre-release:pre-release version number,like alpha,beta,rc,pre,dev,preview,stable,release,final,snapshot.
# build:build number, <year><month><day><random 4 hash>
# gitnumber:git commit number.
#if it's release,it doesn't need 'build',like 1.0.0-release.
# dev,snapshot,nightly:in development version.
# alpha,beta,pre,preview,experimental:pre-release version.
# rc:ready to release version(Release Candidate).
# stable,release,final:release version.
mod_version=1.4.1-release
mod_group_id=org.more_blocks_and_items_team
mod_authors=danhuangsu, Kush_Shul, z.h, Voyagerstar, huangyihao
mod_description=More Decorative Blocks is a Minecraft mod that to add more decorative blocks in the Minecraft.\
  You can use more blocks of it to build better building.\
  We hope they can help you to build the building.
github_api_url=https://api.github.com/repos/MBI-Team/More-Decorative-Blocks/releases/latest
# Minecraft and neoforge info
minecraft_version=1.21.1
minecraft_version_range=[1.21,1.22)
neo_version=21.1.115
neo_version_range=[21,22)
loader_version_range=[4,)
# Gradle and neogradle info
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=false
org.gradle.configuration-cache=false
neogradle.subsystems.neoformruntime.caching.disabled=false
neogradle.subsystems.accessTransformers.enabled=false
neogradle.subsystems.dependencymangement.enabled=false
# The Minecraft version the Parchment version is for
neogradle.subsystems.parchment.minecraftVersion=1.20.2
# The version of the Parchment mappings
neogradle.subsystems.parchment.mappingsVersion=2023.12.10
systemProp.http.keepAlive=true
systemProp.http.maxConnections=100
# SSL and Network Configuration
# Import additional network settings from network.properties file
# This helps resolve SSL certificate validation issues
# Additional SSL and network configuration settings
org.gradle.jvmargs=-Xmx2G \
  -Dhttp.connectionTimeout=60000 \
  -Dhttp.socketTimeout=60000 \
  -Dhttps.connectionTimeout=60000 \
  -Dhttps.socketTimeout=60000 \
  -Dcom.sun.net.useExclusiveBind=false \
  -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 \
  -Dhttp.keepAlive=true \
  -Dhttp.maxConnections=5 \
  -Dcom.sun.security.enableCRLDP=true \
  -Dcom.sun.security.enableAIAcaIssuers=true
# Gradle repository retry settings
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=1000